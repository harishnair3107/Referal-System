<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Referral - Notifications</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; font-family: sans-serif; background: #0f172a; color: white; }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .notif-card { background: #1e293b; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .notif-card.unread { border-left: 4px solid #3b82f6; background: rgba(59, 130, 246, 0.1); }
    .notif-msg { flex: 1; }
    .notif-time { color: #94a3b8; font-size: 0.75rem; margin-top: 0.25rem; }
    .btn-sm { background: #3b82f6; color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .btn-sm:hover { background: #2563eb; }
    .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
    .btn-outline:hover { background: rgba(59, 130, 246, 0.1); }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
      <h1 style="margin:0;">Notifications</h1>
      <button class="btn-sm btn-outline" id="read-all-btn">Mark all as read</button>
    </div>
    
    <div id="notifs-container">
      <div style="text-align:center; padding: 2rem;"><span class="spinner"></span> Loading...</div>
    </div>
  </div>

  <script type="module">
    import { api } from './js/api.js';
    import { renderNavbar } from './js/navbar.js';

    async function init() {
      const user = await renderNavbar();
      if(!user) return;
      loadNotifs();

      document.getElementById('read-all-btn').onclick = async () => {
        try {
          await api.notifications.readAll();
          loadNotifs();
          renderNavbar(); // update badge
        } catch(err){}
      };
    }

    async function loadNotifs() {
      const container = document.getElementById('notifs-container');
      try {
        const { notifications } = await api.notifications.list();
        if (notifications.length === 0) {
          container.innerHTML = '<p style="color:#94a3b8; text-align:center;">No notifications yet.</p>';
          return;
        }

        container.innerHTML = notifications.map(n => `
          <div class="notif-card ${!n.read ? 'unread' : ''}">
            <div class="notif-msg">
              <div>
                ${n.relatedRequestId ? `<a href="request.html?id=${n.relatedRequestId}" style="color:white; text-decoration:none;">${escapeHTML(n.message)}</a>` : escapeHTML(n.message)}
              </div>
              <div class="notif-time">${new Date(n.createdAt).toLocaleString()}</div>
            </div>
            ${!n.read ? `<button class="btn-sm" onclick="markRead('${n._id}')">Mark Read</button>` : ''}
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p style="color:#ef4444; text-align:center;">Failed to load notifications</p>`;
      }
    }

    window.markRead = async (id) => {
      try {
        await api.notifications.readOne(id);
        loadNotifs();
        renderNavbar(); // update badge
      } catch(err){}
    };

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    init();
  </script>
</body>
</html>
